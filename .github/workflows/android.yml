name: Build APEX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apex-android/**'
      - '.github/workflows/android.yml'

# Keep only one APEX APK build queued/running at a time.
concurrency:
  group: apex-android-apk
  cancel-in-progress: true

jobs:
  build:
    # Use the stable Ubuntu 22.04 hosted image instead of the moving ubuntu-latest alias.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Android signing key
        env:
          APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          test -n "$APEX_KEYSTORE_BASE64" || { echo "Missing APEX_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/apex-signing"
          echo "$APEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-signing/apex-release.jks"

      - name: Bundle offline coin logos
        run: |
          set -euo pipefail
          LOGO_DIR="apex-android/app/src/main/assets/coin-logos"
          mkdir -p "$LOGO_DIR"
          for symbol in btc eth bnb sol xrp doge ada trx usdc usdt link ltc bch avax dot zec uni matic atom etc fil; do
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/svg/color/${symbol}.svg" \
              --output "$LOGO_DIR/${symbol}.svg"
            test -s "$LOGO_DIR/${symbol}.svg"
          done
          printf '%s\\n' "Coin logos from spothq/cryptocurrency-icons (MIT license)." > "$LOGO_DIR/README.txt"

      - name: Build native Android APK
        env:
          APEX_API_BASE_URL: ${{ secrets.APEX_API_BASE_URL }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          gradle -p apex-android --no-daemon -PAPEX_API_BASE_URL="$APEX_API_BASE_URL" -PAPEX_KEYSTORE_FILE="$RUNNER_TEMP/apex-signing/apex-release.jks" -PAPEX_KEYSTORE_PASSWORD="$APEX_KEYSTORE_PASSWORD" -PAPEX_KEY_ALIAS="$APEX_KEY_ALIAS" -PAPEX_KEY_PASSWORD="$APEX_KEY_PASSWORD" assembleDebug

      # Do not publish an APK unless Android's own tools confirm its alignment and signature.
      - name: Verify APK integrity, alignment, and signature
        run: |
          set -euo pipefail
          APK="apex-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: apex-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
