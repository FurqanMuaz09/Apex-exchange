name: Build APEX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apex-android/**'
      - '.github/workflows/android.yml'

# Keep only one APEX APK build queued/running at a time.
concurrency:
  group: apex-android-apk
  cancel-in-progress: true

jobs:
  build:
    # Use the stable Ubuntu 22.04 hosted image instead of the moving ubuntu-latest alias.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent Android signing key
        env:
          APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          test -n "$APEX_KEYSTORE_BASE64" || { echo "Missing APEX_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/apex-signing"
          echo "$APEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-signing/apex-release.jks"

      - name: Build native Android APK
        env:
          APEX_API_BASE_URL: ${{ secrets.APEX_API_BASE_URL }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          gradle -p apex-android --no-daemon -PAPEX_API_BASE_URL="$APEX_API_BASE_URL" -PAPEX_KEYSTORE_FILE="$RUNNER_TEMP/apex-signing/apex-release.jks" -PAPEX_KEYSTORE_PASSWORD="$APEX_KEYSTORE_PASSWORD" -PAPEX_KEY_ALIAS="$APEX_KEY_ALIAS" -PAPEX_KEY_PASSWORD="$APEX_KEY_PASSWORD" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: apex-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
