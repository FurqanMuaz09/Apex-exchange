name: Build APEX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android APK
        env:
          APEX_API_BASE_URL: ${{ secrets.APEX_API_BASE_URL }}
        run: gradle -p apex-android --no-daemon -PAPEX_API_BASE_URL="$APEX_API_BASE_URL" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: apex-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
