name: Build APEX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -o APEX-Android-GitHub-Upload.zip -d .

      - name: Restore fixed Android Gradle config
        run: git checkout -- apex-android/app/build.gradle.kts

      - name: Sync latest website files
        run: |
          mkdir -p apex-android/app/src/main/assets/apex
          cp index.html style.css app.js apex-android/app/src/main/assets/apex/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p apex-android --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: apex-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
