# Hostless Cloud deployment for the APEX Node.js backend.
# Secrets must be added in Hostless App -> Environment Variables.
working_directory: backend
build:
  system: auto
  command: "npm install"
start_command: "npm start"
scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.25
  min_memory: 256
  max_memory: 512
health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
